metadata:
  name: Maison / Absent - Tado
  description: Active Presence Tado lorsque je rentre à la maison et le désactive lorsque je suis absent.

automations:
  - name: Maison
    starters:
      - type: home.state.HomePresence
        state: HomePresenceMode
        is: HOME
    actions:
      - type: device.command.OnOff
        devices:
          - Presence - Chauffage
        on: true

  - name: Absent
    starters:
      - type: home.state.HomePresence
        state: HomePresenceMode
        is: AWAY
    actions:
      - type: device.command.OnOff
        devices:
          - Presence - Chauffage
        on: false
